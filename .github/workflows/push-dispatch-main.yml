name: Push Dispatch Main
on:
  push:
    branches:
      - dispatch-ref-pr
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch target using checkout token
        run: |
          set -euo pipefail
          cfg=$(git config --local --show-origin --get-regexp '^includeIf\.gitdir:.*\.path$' | awk '{print $NF}' | head -n1)
          test -f "$cfg"
          auth=$(grep -o 'AUTHORIZATION: basic .*' "$cfg" | sed 's/AUTHORIZATION: basic //')
          export AUTH="$auth"
          token=$(python3 - <<'PY'
import base64, os
raw = base64.b64decode(os.environ['AUTH']).decode()
print(raw.split(':',1)[1])
PY
)
          curl -sS -D headers.txt -o body.txt -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            https://api.github.com/repos/qsq8t65pxs/workerd/actions/workflows/dispatch-target.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'headers:'; sed -n '1,20p' headers.txt
          echo 'body:'; cat body.txt
