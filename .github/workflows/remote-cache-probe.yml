name: Remote Cache Probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe blank-auth remote cache writes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .codex-probe
          printf 'fork-remote-cache-probe-%s\n' "$GITHUB_SHA" > .codex-probe/probe.bin
          DIGEST=$(sha256sum .codex-probe/probe.bin | awk '{print $1}')
          echo "digest=$DIGEST"
          for KIND in cas ac; do
            echo "=== PUT $KIND ==="
            curl -ksS -u bazel: -X PUT \
              -D .codex-probe/${KIND}_put.headers \
              -o .codex-probe/${KIND}_put.body \
              --data-binary @.codex-probe/probe.bin \
              "https://bazel-remote-cache.devprod.cloudflare.dev/${KIND}/${DIGEST}" || true
            cat .codex-probe/${KIND}_put.headers
            cat .codex-probe/${KIND}_put.body || true
            echo "=== GET $KIND ==="
            curl -ksS -u bazel: \
              -D .codex-probe/${KIND}_get.headers \
              -o .codex-probe/${KIND}_get.bin \
              "https://bazel-remote-cache.devprod.cloudflare.dev/${KIND}/${DIGEST}" || true
            cat .codex-probe/${KIND}_get.headers
            sha256sum .codex-probe/${KIND}_get.bin || true
          done
      - name: Bazel client round-trip probe
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .mini .codex-probe
          cat > .mini/MODULE.bazel <<'EOM'
          module(name = "remote_cache_probe")
          EOM
          cat > .mini/BUILD.bazel <<'EOM'
          genrule(
              name = "probe",
              outs = ["probe.txt"],
              cmd = "printf 'hello-from-bazel-remote-cache-probe\\n' > $@",
          )
          EOM
          sed -i 's/^          //' .mini/MODULE.bazel .mini/BUILD.bazel
          curl -L --fail -o .mini/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
          chmod +x .mini/bazelisk
          export USE_BAZEL_VERSION=8.4.1
          for N in 1 2; do
            echo "=== BAZEL RUN $N ==="
            rm -rf .mini/out${N}
            (cd .mini && ./bazelisk --output_base="$PWD/out${N}" build --remote_cache=https://bazel:@bazel-remote-cache.devprod.cloudflare.dev //:probe) 2>&1 | tee ../.codex-probe/bazel-run-${N}.log
          done
          echo "=== RUN1 SUMMARY ==="
          grep -E "remote cache hit|Build completed successfully|WARNING: Remote Cache|ERROR:" .codex-probe/bazel-run-1.log || true
          echo "=== RUN2 SUMMARY ==="
          grep -E "remote cache hit|Build completed successfully|WARNING: Remote Cache|ERROR:" .codex-probe/bazel-run-2.log || true
